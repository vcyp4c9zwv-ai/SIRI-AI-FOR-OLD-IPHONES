
workflows:
  ios-workflow:
    name: Siri AI iOS
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      cocoapods: default
      vars:
        XCODE_PROJECT: SiriAI.xcodeproj
        XCODE_SCHEME: SiriAI

    
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR"
          xcodegen generate --spec project.yml

      - name: Build iOS Simulator
        script: |
          set -o pipefail
          xcodebuild \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
          grep -n -E "error:|warning:|fatal error:" build.log || true
    artifacts:
      - build/Build/Products/Debug-iphonesimulator/*.app
      - build/Build/Products/Debug-iphonesimulator/*.dSYM
      - build.log
